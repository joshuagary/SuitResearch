name: preflight
on:
  workflow_dispatch:
    inputs:
      contact:
        description: Your email (goes in the User-Agent)
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CONTACT: ${{ inputs.contact }}
        run: |
          ARGS=""
          if [ -f urls.txt ]; then ARGS="--urls urls.txt"; fi
          python3 preflight_check.py --contact "$CONTACT" $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-log
          path: preflight_log_*.csv
